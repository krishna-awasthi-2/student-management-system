<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
</head>
<body>
  <header>
    <h1>Student Management System</h1>
    <nav>
      <a href="index.html">Home</a> |
      <a href="register.html">Student Registration</a> |
      <a href="students.html">Student Records</a> |
      <a href="courses.html">Courses</a> |
      <a href="contact.html">Contact</a>
    </nav>
  </header>
  <hr>
  <main>
    <h2>Student Registration Form</h2>
    <p>Enter the details in the sample form below.</p>
    <form action="#" method="get">
      <p><label for="fullname">Full Name:</label><br><input type="text" id="fullname" name="fullname" placeholder="Enter your name" required></p>
      <p><label for="roll">Roll Number:</label><br><input type="text" id="roll" name="roll" placeholder="Enter roll number" required></p>
      <p><label for="email">Email:</label><br><input type="email" id="email" name="email" placeholder="Enter email"></p>
      <p><label for="phone">Phone Number:</label><br><input type="tel" id="phone" name="phone" placeholder="Enter phone number"></p>
      <p><label for="dob">Date of Birth:</label><br><input type="date" id="dob" name="dob"></p>
      <p><label for="branch">Branch:</label><br>
        <select id="branch" name="branch">
          <option value="">Select branch</option>
          <option value="AIML">Artificial Intelligence and Machine Learning</option>
          <option value="CSE">Computer Science Engineering</option>
          <option value="ECE">Electronics and Communication</option>
          <option value="ME">Mechanical Engineering</option>
        </select>
      </p>
      <p><label for="gender">Gender:</label><br>
        <input type="radio" id="male" name="gender" value="Male"><label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female"><label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="Other"><label for="other">Other</label>
      </p>
      <p><label for="address">Address:</label><br><textarea id="address" name="address" rows="4" cols="30" placeholder="Enter your address"></textarea></p>
      <p><button type="submit">Submit</button> <button type="reset">Reset</button></p>
    </form>
    <p><strong>Note:</strong> This is an HTML demonstration form. It does not save information to a database.</p>
  </main>
  <hr>
  <footer><p>HTML Training Project</p></footer>
</body>
</html>
